name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and Build
        run: msbuild TotalBlack.sln /t:Restore,Build /p:Configuration=Release /v:minimal

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotalBlack-vsix
          path: TotalBlack/bin/Release/TotalBlack.vsix
          if-no-files-found: error
