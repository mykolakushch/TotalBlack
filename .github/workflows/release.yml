name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VSIX Version from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Invalid tag version format: $tag. Expected vX.Y.Z"
          }
          $manifestPath = "TotalBlack/source.extension.vsixmanifest"
          [xml]$manifest = Get-Content $manifestPath -Encoding UTF8
          $manifest.PackageManifest.Metadata.Identity.Version = $version
          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.IndentChars = "    "
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $writer = [System.Xml.XmlWriter]::Create((Resolve-Path $manifestPath), $settings)
          $manifest.Save($writer)
          $writer.Close()
          Write-Host "Updated VSIX version to $version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and Build VSIX
        run: msbuild TotalBlack.sln /t:Restore,Build /p:Configuration=Release /v:minimal

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TotalBlack/bin/Release/TotalBlack.vsix

      - name: Publish to Visual Studio Marketplace (OIDC)
        shell: pwsh
        run: |
          $oidcUri = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=marketplace.visualstudio.com"
          $oidc = Invoke-RestMethod -Uri $oidcUri -Headers @{ Authorization = "Bearer $($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" }

          $payloadB64 = $oidc.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          switch ($payloadB64.Length % 4) { 2 { $payloadB64 += '==' } 3 { $payloadB64 += '=' } }
          $claims = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payloadB64)) | ConvertFrom-Json
          Write-Host "OIDC claims: aud=$($claims.aud) iss=$($claims.iss) sub=$($claims.sub) repo_id=$($claims.repository_id) owner_id=$($claims.repository_owner_id) job_workflow_ref=$($claims.job_workflow_ref) env=$($claims.environment)"

          $exchange = Invoke-RestMethod -Method Post `
            -Uri "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1" `
            -Headers @{
              Authorization = "FederatedToken $($oidc.value)"
              Accept = "application/json"
              "X-Market-CI-Provider" = "github-actions"
            } `
            -ContentType "application/json" `
            -Body (@{ publisherName = "mnml" } | ConvertTo-Json)

          $token = $exchange.credential
          if (-not $token) {
            throw "Failed to obtain Marketplace session token from OIDC exchange."
          }
          Write-Host "::add-mask::$token"

          $publisher = Get-Item "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools\*\tools\VSSDK\bin\VsixPublisher.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $publisher publish `
            -payload "TotalBlack\bin\Release\TotalBlack.vsix" `
            -publishManifest "publishManifest.json" `
            -personalAccessToken $token
